[package]
name = "horizon-blueprint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Blueprint & Automatic Building System for Horizon (Litematica-style)"

[dependencies]
horizon-client = { path = "../../../horizon-client" }
horizon-client-render = { path = "../../../horizon-client-render" }
horizon-world = { path = "../../../horizon-world" }
horizon-core = { path = "../../../horizon-core" }
horizon-assets = { path = "../../../horizon-assets" }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.26", features = ["scalar-math"] }
wgpu = { version = "30.0.1", features = [] }
thiserror = "1.0"
parking_lot = "0.12"
crossbeam = "0.8"
bytemuck = { version = "1.14", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

[lib]
name = "horizon_blueprint"
path = "lib.rs"
